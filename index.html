<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playdate, an experiment in creative gathering</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="https://hc-cdn.hel1.your-objectstorage.com/s/v3/c2bbd6a27f678a9ffa2b91acf53c6626a274e2d1_playdate-icon.png">

    <meta property="og:image" content="https://hc-cdn.hel1.your-objectstorage.com/s/v3/f472b9982690e73c74114ed74b6f78cf1389955a_image.png">
</head>
<body class="home">
    <h1 class="wordmark">playdate</h1>
    <a class="info-link" href="info.html">info</a>

    <!-- 12 tiles, each rotated 30° further clockwise, starting at the top -->
    <main class="ring" aria-label="Ask me out on a (play) date">
        <img class="tile" style="--angle: 0deg" src="assets/playdate-black.jpg" alt="Ask me out on a (play) date">
        <img class="tile" style="--angle: 30deg" src="assets/playdate-blue.jpg" alt="">
        <img class="tile" style="--angle: 60deg" src="assets/playdate-red.jpg" alt="">
        <img class="tile" style="--angle: 90deg" src="assets/playdate-blue.jpg" alt="">
        <img class="tile" style="--angle: 120deg" src="assets/playdate-yellow.jpg" alt="">
        <img class="tile" style="--angle: 150deg" src="assets/playdate-green.jpg" alt="">
        <img class="tile" style="--angle: 180deg" src="assets/playdate-black.jpg" alt="">
        <img class="tile" style="--angle: 210deg" src="assets/playdate-red.jpg" alt="">
        <img class="tile" style="--angle: 240deg" src="assets/playdate-blue.jpg" alt="">
        <img class="tile" style="--angle: 270deg" src="assets/playdate-yellow.jpg" alt="">
        <img class="tile" style="--angle: 300deg" src="assets/playdate-red.jpg" alt="">
        <img class="tile" style="--angle: 330deg" src="assets/playdate-green.jpg" alt="">
    </main>
</body>
</html>
